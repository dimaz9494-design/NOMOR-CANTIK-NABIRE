<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perdana Spesial Nomor Cantik – Nabire</title>

  <!-- FONT POPPINS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background: #b51217;
      color: #fff;
    }

    /* HEADER */
    .top-bar {
      display: flex;
      justify-content: space-between;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .logo {
      height: 22px;
      object-fit: contain;
    }

    /* HERO */
    .hero {
      padding: 24px 20px 10px;
    }

    .hero h1 {
      font-size: 34px;
      line-height: 1.05;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1.5px;
      margin-bottom: 10px;
      text-shadow:
        -4px -4px 0 #f7941d,
         4px -4px 0 #f7941d,
        -4px  4px 0 #f7941d,
         4px  4px 0 #f7941d,
        -4px  0px 0 #f7941d,
         4px  0px 0 #f7941d,
         0px -4px 0 #f7941d,
         0px  4px 0 #f7941d,
         0px 10px 0 rgba(0,0,0,0.35),
         0px 18px 25px rgba(0,0,0,0.45);
    }

    .hero .subtitle {
      color: #ffd200;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .quota {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
    }

    .quota strong {
      font-size: 32px;
      display: block;
    }

    .terms {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .hero-image {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .hero-image img {
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }

    /* LIST */
    .section-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin: 30px 0 12px;
    }

    .search-box {
      padding: 0 20px 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
    }

    .list {
      padding: 0 20px 40px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: #fff;
      color: #000;
      padding: 16px 18px;
      border-radius: 16px;
    }

    .card .status {
      font-size: 13px;
      margin-bottom: 6px;
    }

    .card .price {
      color: #0a8f3d;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .btn-order {
      display: block;
      width: 100%;
      padding: 12px;
      background: #d50000;
      color: #fff;
      text-align: center;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }

    .btn-order.disabled {
      background: #ccc;
      color: #666;
      pointer-events: none;
    }

    .not-found {
      text-align: center;
      padding: 30px 10px;
      font-weight: 700;
      opacity: 0.9;
    }

    @media (min-width: 900px) {
      .hero {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        align-items: center;
        gap: 40px;
      }

      .list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="top-bar">
  <div>Nabire</div>
  <img src="LOGO TSEL PUTIH.png" class="logo">
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Perdana Spesial Nomor Cantik</h1>
    <div class="subtitle">Bonus Kuota 260GB Selama Setahun</div>

    <div class="quota">
      <div>Bulan Pertama<strong>40GB</strong></div>
      <div>Bulan Kedua & Seterusnya<strong>20GB</strong></div>
    </div>

    <div class="terms">
      • Stok terbatas<br>
      • Kuota berlaku setiap bulan<br>
      • Masa aktif hingga 2027 setelah registrasi
    </div>
  </div>

  <div class="hero-image">
    <img src="PERDANA SPESIAL NOMOR CANTIK.png">
  </div>
</section>

<div class="section-title">Daftar Nomor Cantik</div>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari nomor...">
</div>

<div class="list" id="list"></div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvpq2x-mW4BIZQvynQKfN0stOXX6lgPxaq6_njg_VY8PKKJljU7JcTQRCOKCHYhMKgZ33tmoS_zYmj/pub?output=csv";
let allData = [];

fetch(SHEET_URL)
  .then(r => r.text())
  .then(csv => {
    const rows = csv.split("\n").slice(1);
    allData = rows.map(r => {
      const [nomor, status, harga, , link] = r.split(",");
      return { nomor, status, harga, link };
    });
    render(allData);
  });

function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (data.length === 0) {
    list.innerHTML = `<div class="not-found">Nomor Tidak Ditemukan</div>`;
    return;
  }

  data.forEach(d => {
    const tersedia = d.status.trim().toLowerCase() === "tersedia";

    list.innerHTML += `
      <div class="card">
        <b>${d.nomor}</b>
        <div class="status">${d.status}</div>
        <div class="price">Rp ${Number(d.harga).toLocaleString()}</div>
        <a href="${tersedia ? d.link : '#'}"
           target="_blank"
           class="btn-order ${tersedia ? '' : 'disabled'}">
           ${tersedia ? 'Pesan Sekarang' : 'Sold Out'}
        </a>
      </div>
    `;
  });
}

document.getElementById("search").addEventListener("input", e => {
  const val = e.target.value.trim();
  render(allData.filter(d => d.nomor.includes(val)));
});
</script>

</body>
</html>
